name: Sync from GitCode

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync-gitcode.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitCode master to GitHub master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --bare --single-branch --branch master https://gitcode.com/openharmony/multimedia_audio_framework.git upstream.git
          cd upstream.git
          git push --force-with-lease=refs/heads/master:${GITHUB_SHA} "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/master:refs/heads/master
